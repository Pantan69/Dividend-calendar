name: Update dividend & earnings data

concurrency:
  group: dividend-calendar-data-update
  cancel-in-progress: false

on:
  schedule:
    - cron: "0 6 * * *"      # classify_dividends.py -- tous les jours (rapide, ne re-teste que ce qui est du)
    - cron: "15 6 * * *"     # update_dividends.py -- planificateur Alpha Vantage, tous les jours
    - cron: "0 7 * * 1"      # collect_data.py --earnings -- calendrier resultats, chaque lundi
    - cron: "0 * * * 1-5"    # collect_data.py --prices -- cours, toutes les heures en semaine
  workflow_dispatch:
    inputs:
      task:
        description: "Quelle tache lancer manuellement"
        required: true
        default: "all"
        type: choice
        options: [all, classify, dividends, earnings, prices]

jobs:
  run:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Determine which task this run is
        id: task
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "task=${{ github.event.inputs.task }}" >> "$GITHUB_OUTPUT"
          else
            case "${{ github.event.schedule }}" in
              "0 6 * * *")   echo "task=classify"  >> "$GITHUB_OUTPUT" ;;
              "15 6 * * *")  echo "task=dividends" >> "$GITHUB_OUTPUT" ;;
              "0 7 * * 1")   echo "task=earnings"  >> "$GITHUB_OUTPUT" ;;
              "0 * * * 1-5") echo "task=prices"    >> "$GITHUB_OUTPUT" ;;
              *)             echo "task=all"       >> "$GITHUB_OUTPUT" ;;
            esac
          fi

      - name: Classify dividend payers (Finnhub /metric)
        if: steps.task.outputs.task == 'classify' || steps.task.outputs.task == 'all'
        env:
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
        run: python classify_dividends.py

      - name: Update dividend dates & amounts (Alpha Vantage)
        if: steps.task.outputs.task == 'dividends' || steps.task.outputs.task == 'all'
        env:
          ALPHAVANTAGE_API_KEY: ${{ secrets.ALPHAVANTAGE_API_KEY }}
        run: python update_dividends.py

      - name: Update earnings calendar (Finnhub, bulk)
        if: steps.task.outputs.task == 'earnings' || steps.task.outputs.task == 'all'
        env:
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
        run: python collect_data.py --earnings

      - name: Refresh prices (Finnhub)
        if: steps.task.outputs.task == 'prices' || steps.task.outputs.task == 'all'
        env:
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
        run: python collect_data.py --prices

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --quiet --cached; then
            echo "Rien a committer."
            exit 0
          fi
          git commit -m "Mise a jour automatique des donnees (${{ steps.task.outputs.task }})"
          for i in 1 2 3 4 5; do
            git pull --rebase origin main && git push && exit 0
            echo "Push echoue (tentative $i/5), nouvelle tentative dans 5s..."
            sleep 5
          done
          echo "Echec definitif du push apres 5 tentatives."
          exit 1
